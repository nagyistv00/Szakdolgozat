rules:
  - id: m2-python-eval
    languages: [python]
    severity: WARNING
    message: Direct eval call; assess whether untrusted input can reach it.
    metadata:
      cwe: CWE-95
    pattern: eval(...)
  - id: m2-python-shell
    languages: [python]
    severity: WARNING
    message: Subprocess uses a shell; assess input control and quoting.
    metadata:
      cwe: CWE-78
    pattern: subprocess.$FUNC(..., shell=True, ...)
  - id: m2-python-sql-format
    languages: [python]
    severity: WARNING
    message: Formatted string passed to execute; verify whether SQL values are parameterised.
    metadata:
      cwe: CWE-89
    pattern: $CURSOR.execute(f"...", ...)
